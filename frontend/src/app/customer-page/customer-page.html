<div class="container">

  <h2 class="title">Gestione Customer</h2>

  <div class="card">
    <h3 class="subtitle">Inserisci Nuovo Cliente</h3>

    <div class="form">
      <input class="form__input" [(ngModel)]="newCustomer.name" placeholder="Nome">
      <input class="form__input" [(ngModel)]="newCustomer.surname" placeholder="Cognome">
      <input class="form__input" [(ngModel)]="newCustomer.email" placeholder="Email">

      <select class="form__select" [(ngModel)]="newCustomer.trainer_id">
        <option value="">Seleziona Trainer</option>
        <option *ngFor="let t of trainers" [value]="t.id">
          {{t.name}} {{t.surname}}
        </option>
      </select>

      <button class="btn btn--primary" (click)="saveCustomer()">Salva</button>
    </div>
  </div>

  <table class="table">
    <tr>
      <th>Nome</th>
      <th>Cognome</th>
      <th>Email</th>
      <th>Trainer</th>
      <th>Azione</th>
    </tr>

    <tr *ngFor="let c of customers">
      <td>{{c.name}}</td>
      <td>{{c.surname}}</td>
      <td>{{c.email}}</td>
      <td>{{c.trainer_name}} {{c.trainer_surname}}</td>
      <td>
        <button class="btn btn--danger" (click)="removeCustomer(c.id)">
          Elimina
        </button>
      </td>
    </tr>
  </table>

</div>
