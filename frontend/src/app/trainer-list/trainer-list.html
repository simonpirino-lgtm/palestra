<div class="container">

  <h2 class="title">Lista Trainer</h2>

  <table class="table">
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Cognome</th>
      <th>Specializzazione</th>
    </tr>

    <tr *ngFor="let t of trainers">
      <td>{{t.id}}</td>
      <td>{{t.name}}</td>
      <td>{{t.surname}}</td>
      <td>{{t.speciality}}</td>
    </tr>
  </table>

</div>
