<h2>Lista Trainer</h2>

<table border="1" align="center">
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Cognome</th>
    <th>Specializzazione</th>
  </tr>

  <tr *ngFor="let t of trainers">
    <td>{{t.id}}</td>
    <td>{{t.name}}</td>
    <td>{{t.surname}}</td>
    <td>{{t.speciality}}</td>
  </tr>
</table>

<br>
<a routerLink="/">Home</a>
