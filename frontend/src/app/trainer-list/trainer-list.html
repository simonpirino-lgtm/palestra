<div class="page">

  <div class="card">

    <h2>Lista Trainer</h2>

    <table>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Cognome</th>
        <th>Specializzazione</th>
      </tr>

      <tr *ngFor="let t of trainers">
        <td>{{t.id}}</td>
        <td>{{t.name}}</td>
        <td>{{t.surname}}</td>
        <td>{{t.speciality}}</td>
      </tr>
    </table><br>

    <div class="nav">
      <a routerLink="/">Home</a>
      <a routerLink="/trainers">Trainer</a>
      <a routerLink="/customers">Customer</a>
    </div>

  </div>

</div>
